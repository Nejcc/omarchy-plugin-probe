name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits so a moved tag can't change what runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash tests/probe.test.sh
      - run: shellcheck bin/probe tests/probe.test.sh
